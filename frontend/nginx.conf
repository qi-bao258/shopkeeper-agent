# 电商问数前端 Nginx 配置
#
# - 静态资源 + SPA fallback（React Router 刷新不 404）
# - /api 反代到后端容器，避免浏览器跨域，也让容器间走内部网络

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：找不到文件就交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（对应 vite.config.ts 里的 /api proxy）
    location /api/ {
        # 保留 /api 前缀：后端路由本身即以 /api 开头，不可剥离
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 问数接口可能耗时较长（LLM + 检索），放宽超时
        proxy_read_timeout 300s;
        proxy_connect_timeout 15s;

        # SSE / 流式响应：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
